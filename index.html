<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตารางทำงาน (Firebase Realtime)</title>
    <!-- ปรับสไตล์เป็น Tailwind แบบเสถียรเพื่อให้หน้าเว็บสวยงามแน่นอน -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- แถบด้านบน (Header) -->
    <header class="bg-blue-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">📆 ระบบตารางการทำงานทีม</h1>
        <div>
            <span id="userStatus" class="mr-2 text-sm bg-blue-700 px-3 py-1 rounded-full">สถานะ: พนักงานทั่วไป (ดูได้อย่างเดียว)</span>
            <button id="authBtn" class="bg-white text-blue-600 font-semibold px-4 py-1 rounded hover:bg-gray-100 transition shadow">ล็อกอินหัวหน้า</button>
        </div>
    </header>

    <!-- ส่วนเนื้อหาหลัก -->
    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full">
        <!-- ฟอร์มจัดการข้อมูล (จะแสดงเฉพาะเมื่อหัวหน้าล็อกอินแล้วเท่านั้น) -->
        <div id="managerPanel" class="hidden bg-white p-6 rounded-lg shadow-md border border-gray-200 mb-6">
            <h2 class="text-lg font-bold mb-4 text-blue-600">🛠️ แผงควบคุมสำหรับหัวหน้างาน</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">ชื่อพนักงาน</label>
                    <input type="text" id="workerName" placeholder="ระบุชื่อพนักงาน" class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">กะการทำงาน</label>
                    <input type="text" id="workShift" placeholder="เช่น เช้า, บ่าย, ดึก" class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">วันที่ทำงาน</label>
                    <input type="date" id="workDate" class="border p-2 rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <button id="saveBtn" class="bg-green-500 text-white px-6 py-2 rounded font-semibold hover:bg-green-600 transition shadow">บันทึกลงตารางงาน</button>
        </div>

        <!-- ตารางแสดงผลงาน -->
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
            <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
                <h2 class="text-lg font-bold">📅 ตารางงานปัจจุบัน (ข้อมูลอัปเดตเรียลไทม์)</h2>
                <button id="exportBtn" class="bg-gray-700 text-white px-4 py-1.5 rounded text-sm hover:bg-gray-800 transition shadow">📥 ดาวน์โหลดตารางงาน</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 border-b border-gray-200">
                            <th class="p-3 font-semibold">วันที่</th>
                            <th class="p-3 font-semibold">ชื่อพนักงาน</th>
                            <th class="p-3 font-semibold">กะทำงาน</th>
                            <th id="thAction" class="p-3 font-semibold hidden">การจัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleTableBody">
                        <tr>
                            <td colspan="4" class="p-4 text-center text-gray-500">กำลังโหลดข้อมูลตารางงาน...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ป็อปอัปหน้าต่างล็อกอิน -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-lg max-w-sm w-full shadow-xl">
            <h3 class="text-lg font-bold mb-4">🔐 เข้าสู่ระบบหัวหน้างาน</h3>
            <input type="email" id="loginEmail" placeholder="อีเมลหัวหน้างาน" class="border p-2 rounded w-full mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="loginPassword" placeholder="รหัสผ่าน" class="border p-2 rounded w-full mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div class="flex justify-end gap-2">
                <button id="closeLoginBtn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300">ยกเลิก</button>
                <button id="doLoginBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">เข้าสู่ระบบ</button>
            </div>
        </div>
    </div>

    <!-- เชื่อมต่อโมดูล Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://gstatic.com";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://gstatic.com";

        // คอนฟิกหลักที่คุณสร้างไว้เชื่อมมาที่นี่
        const firebaseConfig = {
          apiKey: "AIzaSyBQ-gXhDbRsWR80syCSNhb0zRuW2ycpyb4",
          authDomain: "://firebaseapp.com",
          projectId: "best-service-kk",
          storageBucket: "best-service-kk.firebasestorage.app",
          messagingSenderId: "111306463136",
          appId: "1:111306463136:web:55f8cfca541dc7451e76c5",
          measurementId: "G-GMW4D9E16F"
        };

        // เริ่มต้นการทำงานระบบหลังบ้าน
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentManager = null;
        let localData = [];

        // ส่วนควบคุม UI และปุ่มต่างๆ
        const authBtn = document.getElementById('authBtn');
        const userStatus = document.getElementById('userStatus');
        const managerPanel = document.getElementById('managerPanel');
        const loginModal = document.getElementById('loginModal');
        const scheduleTableBody = document.getElementById('scheduleTableBody');
        const thAction = document.getElementById('thAction');

        // ติดตามสถานะผู้ใช้ (ล็อกอินอยู่หรือไม่)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentManager = user;
                authBtn.innerText = "ออกจากระบบ";
                userStatus.innerText = `สถานะ: หัวหน้างาน (${user.email})`;
                userStatus.className = "mr-2 text-sm bg-green-600 px-3 py-1 rounded-full text-white";
                managerPanel.classList.remove('hidden');
                thAction.classList.remove('hidden');
            } else {
                currentManager = null;
                authBtn.innerText = "ล็อกอินหัวหน้า";
                userStatus.innerText = "สถานะ: พนักงานทั่วไป (ดูได้อย่างเดียว)";
                userStatus.className = "mr-2 text-sm bg-blue-700 px-3 py-1 rounded-full text-white";
                managerPanel.classList.add('hidden');
                thAction.classList.add('hidden');
            }
            // รีเฟรชตารางเพื่อให้แสดงผลปุ่มลบตามสิทธิ์ปัจจุบัน
            renderTable(localData);
        });

        // เปิด-ปิด หน้าต่างล็อกอิน
        authBtn.addEventListener('click', () => {
            if (currentManager) {
                signOut(auth);
            } else {
                loginModal.classList.remove('hidden');
            }
        });
        document.getElementById('closeLoginBtn').addEventListener('click', () => loginModal.classList.add('hidden'));

        // ประมวลผลการล็อกอิน
        document.getElementById('doLoginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                loginModal.classList.add('hidden');
                document.getElementById('loginEmail').value = '';
                document.getElementById('loginPassword').value = '';
            } catch (error) {
                alert("อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง");
            }
        });

        // บันทึกข้อมูลตารางงานใหม่ไปยัง Firebase Firestore
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const name = document.getElementById('workerName').value;
            const shift = document.getElementById('workShift').value;
            const date = document.getElementById('workDate').value;

            if(!name || !shift || !date) {
                alert("กรุณากรอกข้อมูลตารางงานให้ครบทุกช่องก่อนบันทึกครับ");
                return;
            }

            try {
                await addDoc(collection(db, "schedules"), {
                    name: name,
                    shift: shift,
                    date: date,
                    createdAt: new Date().getTime()
                });
                document.getElementById('workerName').value = '';
                document.getElementById('workShift').value = '';
                document.getElementById('workDate').value = '';
            } catch (e) {
                alert("เกิดข้อผิดพลาดในการบันทึก: " + e.message);
            }
        });

        // ฟังก์ชันวาดตารางแสดงผล
        function renderTable(dataList) {
            scheduleTableBody.innerHTML = '';
            if(dataList.length === 0) {
scheduleTableBody.innerHTML = 'ไม่มีข้อมูลตารางงานในขณะนี้';
return;
}
dataList.forEach((data) => {
const tr = document.createElement('tr');
tr.className = "border-b border-gray-100 hover:bg-gray-50";
let actionTd = '';
if (currentManager) {
actionTd = <td class="p-3"><button class="bg-red-500 text-white text-xs px-2 py-1 rounded hover:bg-red-600 transition shadow" onclick="window.deleteSchedule('${data.id}')">ลบ</button></td>;
}
tr.innerHTML = `
${data.date}
${data.name}
${data.shift}
${actionTd}
`;
scheduleTableBody.appendChild(tr);
});
}
// ดึงข้อมูลและดักจับความเปลี่ยนแปลงแบบเรียลไทม์ (Realtime Sync)
const q = query(collection(db, "schedules"), orderBy("date", "asc"));
onSnapshot(q, (snapshot) => {
localData = [];
snapshot.forEach((docSnap) => {
localData.push({ id: docSnap.id, ...docSnap.data() });
});
renderTable(localData);
});
// ฟังก์ชันลบตารางงานสำหรับหัวหน้างาน
window.deleteSchedule = async (id) => {
if(confirm("คุณแน่ใจหรือไม่ว่าต้องการลบรายการตารางงานนี้?")) {
try {
await deleteDoc(doc(db, "schedules", id));
} catch (e) {
alert("ไม่สามารถลบข้อมูลได้: " + e.message);
}
}
};
// ฟังก์ชันดาวน์โหลดไฟล์แบบ CSV สำหรับดูใน Excel
document.getElementById('exportBtn').addEventListener('click', () => {
if(localData.length === 0) {
alert("ไม่มีข้อมูลในตารางที่จะดาวน์โหลดได้ในขณะนี้");
return;
}
let csvContent = "\uFEFFวันที่,ชื่อพนักงาน,กะทำงาน\n";
localData.forEach(row => {
csvContent += ${row.date},${row.name},${row.shift}\n;
});
const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
const url = URL.createObjectURL(blob);
const link = document.createElement("a");
link.setAttribute("href", url);
link.setAttribute("download", ตารางงาน_อัปเดต.csv);
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
});
